<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VessieOS · Complete System Dashboard</title>
  <link rel="stylesheet" href="../../CSS/base/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .system-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .system-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .system-card h3 {
      color: #667eea;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .system-status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .status-ready {
      background: #d4edda;
      color: #155724;
    }

    .status-loading {
      background: #fff3cd;
      color: #856404;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
    }

    .log-container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
    }

    .log-container h2 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .log-entries {
      background: #1e1e1e;
      color: #0f0;
      padding: 15px;
      border-radius: 5px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .log-entry {
      margin-bottom: 5px;
    }

    .log-entry .timestamp {
      color: #888;
    }

    .log-entry .message {
      color: #0f0;
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
    }

    .btn-info {
      background: #17a2b8;
      color: white;
    }

    .btn-info:hover {
      background: #138496;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
    }

    .system-details {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 0.95rem;
    }

    .detail-label {
      color: #666;
      font-weight: bold;
    }

    .detail-value {
      color: #667eea;
    }

    @media (max-width: 768px) {
      .dashboard-header h1 {
        font-size: 1.8rem;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
      <h1>🚀 VessieOS</h1>
      <p>Complete System Dashboard</p>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="startBoot()">Boot System</button>
      <button class="btn btn-success" onclick="startAutoExecution()">Auto Execute</button>
      <button class="btn btn-info" onclick="collectGames()">Collect Games</button>
      <button class="btn btn-info" onclick="fetchWebContent()">Fetch Web Content</button>
      <button class="btn btn-danger" onclick="shutdownSystem()">Shutdown</button>
    </div>

    <div class="dashboard-grid" id="systems-grid">
      <!-- Systems will be populated here -->
    </div>

    <div class="log-container">
      <h2>📋 System Log</h2>
      <div class="log-entries" id="log-entries">
        <div class="log-entry"><span class="message">Waiting for boot...</span></div>
      </div>
    </div>
  </div>

  <!-- Load all kernel systems -->
  <script src="../../JS/kernel/responsive-renderer.js"></script>
  <script src="../../JS/kernel/windows-executor.js"></script>
  <script src="../../JS/kernel/module-system.js"></script>
  <script src="../../JS/kernel/lm-studio-ai.js"></script>
  <script src="../../JS/systems/game-hub-collector.js"></script>
  <script src="../../JS/kernel/web-content-fetcher.js"></script>
  <script src="../../JS/kernel/boot-manager.js"></script>

  <script>
    let bootManager = null;

    async function startBoot() {
      console.log('Starting VessieOS boot...');
      try {
        await VessieOS.boot();
        updateDashboard();
      } catch (error) {
        addLog(`❌ Boot Error: ${error.message}`);
      }
    }

    async function startAutoExecution() {
      console.log('Starting auto execution...');
      try {
        if (!bootManager) {
          bootManager = window.VessieOSBootManager;
        }
        const results = await bootManager.autoExecute();
        updateDashboard();
      } catch (error) {
        addLog(`❌ Execution Error: ${error.message}`);
      }
    }

    async function collectGames() {
      console.log('Starting game collection...');
      try {
        const gameHub = VessieOS.getSystem('gameHub');
        if (gameHub) {
          const results = await gameHub.collectAll();
          addLog(`✓ Game Collection Complete: ${gameHub.getStats().totalGames} games found`);
          updateDashboard();
        }
      } catch (error) {
        addLog(`❌ Game Collection Error: ${error.message}`);
      }
    }

    async function fetchWebContent() {
      console.log('Starting web content fetch...');
      try {
        const fetcher = VessieOS.getSystem('webFetcher');
        if (fetcher) {
          addLog('Searching web for content...');
          const system = await fetcher.generateSystem('VessieOS Framework');
          addLog(`✓ Generated system: ${system.name}`);
        }
      } catch (error) {
        addLog(`❌ Web Fetch Error: ${error.message}`);
      }
    }

    async function shutdownSystem() {
      console.log('Shutting down...');
      try {
        if (bootManager) {
          await bootManager.shutdown();
          addLog('✓ VessieOS shutdown complete');
        }
      } catch (error) {
        addLog(`❌ Shutdown Error: ${error.message}`);
      }
    }

    function updateDashboard() {
      const status = VessieOS.getStatus();
      if (!status) return;

      const grid = document.getElementById('systems-grid');
      grid.innerHTML = '';

      // Responsive Renderer
      grid.innerHTML += `
        <div class="system-card">
          <h3>📐 Responsive Renderer</h3>
          <p>Screen adaptation and layout system</p>
          <div class="system-details">
            <div class="detail-row">
              <span class="detail-label">Viewport:</span>
              <span class="detail-value">${status.responsive?.width}x${status.responsive?.height}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Breakpoint:</span>
              <span class="detail-value">${status.responsive?.breakpoint}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Type:</span>
              <span class="detail-value">${status.responsive?.isMobile ? 'Mobile' : status.responsive?.isTablet ? 'Tablet' : 'Desktop'}</span>
            </div>
          </div>
          <div class="system-status status-ready">✓ Ready</div>
        </div>
      `;

      // Game Hub
      grid.innerHTML += `
        <div class="system-card">
          <h3>🎮 Game Hub</h3>
          <p>Automatic game collection system</p>
          <div class="system-details">
            <div class="detail-row">
              <span class="detail-label">Total Games:</span>
              <span class="detail-value">${status.gameHub?.totalGames || 0}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Sources:</span>
              <span class="detail-value">${Object.keys(status.gameHub?.bySource || {}).length}</span>
            </div>
          </div>
          <div class="system-status status-ready">✓ Ready</div>
        </div>
      `;

      // AI Engine
      grid.innerHTML += `
        <div class="system-card">
          <h3>🤖 AI Engine</h3>
          <p>LM Studio integration</p>
          <div class="system-details">
            <div class="detail-row">
              <span class="detail-label">Status:</span>
              <span class="detail-value">${status.ai?.isConnected ? 'Connected' : 'Offline'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Models:</span>
              <span class="detail-value">${status.ai?.availableModels?.length || 0}</span>
            </div>
          </div>
          <div class="system-status ${status.ai?.isConnected ? 'status-ready' : 'status-loading'}">
            ${status.ai?.isConnected ? '✓ Connected' : '⚠ Offline'}
          </div>
        </div>
      `;

      // Module System
      grid.innerHTML += `
        <div class="system-card">
          <h3>📦 Module System</h3>
          <p>Automatic task execution</p>
          <div class="system-details">
            <div class="detail-row">
              <span class="detail-label">Modules:</span>
              <span class="detail-value">${status.modules?.length || 0}</span>
            </div>
          </div>
          <div class="system-status status-ready">✓ Ready</div>
        </div>
      `;
    }

    function addLog(message) {
      const logContainer = document.getElementById('log-entries');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="timestamp">[${time}]</span> <span class="message">${message}</span>`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Listen for system status updates
    document.addEventListener('system-status', (e) => {
      console.log('System status updated:', e.detail);
    });

    // Initial update
    addLog('🎬 VessieOS Dashboard Ready');
    addLog('Click "Boot System" to start');
  </script>
</body>
</html>
