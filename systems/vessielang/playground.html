<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VessieLang Playground · VessieOS</title>
  <style>
    :root {
      --accent: #a78bfa;
      --accent-blue: #60a5fa;
      --accent-cyan: #22d3ee;
      --bg-dark: #0f0f1a;
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% -10%, rgba(167, 139, 250, .25), transparent 55%), var(--bg-dark);
      color: #eee;
      font-family: 'Segoe UI', Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.15rem;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header .badge {
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: #b7bdd6;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }

    section {
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-title {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #8a90a0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    #examples { overflow-y: auto; }

    .example-item {
      padding: 10px 16px;
      font-size: .85rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      color: #cbd0e0;
    }

    .example-item:hover { background: var(--glass); }

    textarea#code {
      flex: 1;
      resize: none;
      border: none;
      background: transparent;
      color: #e5e7eb;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: .88rem;
      padding: 16px;
      outline: none;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-blue));
      border: none;
      color: #0f0f1a;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .82rem;
    }

    button.secondary {
      background: var(--glass);
      color: #e5e7eb;
      border: 1px solid var(--border);
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: .82rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .line-nivel { color: var(--accent-cyan); }
    .line-erro { color: #f87171; }
    .line-ok { color: #86efac; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-ok { background: #4ade80; }
    .status-off { background: #6b7280; }
  </style>
</head>

<body>
  <header>
    <h1>VessieLang Playground</h1>
    <span class="badge" id="engine-status"><span class="status-dot status-off"></span> carregando motor…</span>
    <span class="badge">dialetos: B1 · J3 · G5 · FULL</span>
  </header>

  <main>
    <section>
      <div class="panel-title">Exemplos</div>
      <div id="examples"></div>
    </section>

    <section>
      <div class="panel-title">Código (.vl)</div>
      <textarea id="code" spellcheck="false">// Bem-vindo ao VessieLang!
// Este script usa as novas APIs integradas ao VessieOS.

escreva("Ola do VessieLang!");
gui.notify("VessieLang", "Script executado com sucesso", "success");

var xp = 10;
escreva("XP inicial: " + xp);

// Tente também (assincrono, veja o resultado com collector.lastGames()):
// collector.games();
// ai.ask("Diga ola em uma frase curta");
</textarea>
      <div class="toolbar">
        <button id="run">▶ Executar</button>
        <button class="secondary" id="clear">Limpar saída</button>
      </div>
    </section>

    <section>
      <div class="panel-title">Saída</div>
      <div id="output"></div>
    </section>
  </main>

  <!-- Mesma cadeia clássica registrada em JS/systems/desktop/main.js —
       reaproveitada aqui para permitir testar a linguagem isoladamente,
       sem precisar dar boot no VessieOS completo. -->
  <script src="../../JS/kernel/modules/vessielang/lib/B1_Lang.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/J3_Lang.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/G5_Lang.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/VL_Full.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/dispatcher.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-fs.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-security.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-kernel.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-modules.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-os.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/vl-gamehub.js"></script>
  <script src="../../JS/systems/game-hub-collector.js"></script>
  <script src="../../JS/kernel/web-content-fetcher.js"></script>
  <script src="../../JS/kernel/modules/vessielang/lib/runtime-bridge.js"></script>

  <script>
    const outputEl = document.getElementById('output');
    const codeEl = document.getElementById('code');
    const statusEl = document.getElementById('engine-status');
    const examplesEl = document.getElementById('examples');

    function print(text, cls) {
      const div = document.createElement('div');
      if (cls) div.className = cls;
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function refreshStatus() {
      const ok = !!window.VessieLangRuntime;
      statusEl.innerHTML = `<span class="status-dot ${ok ? 'status-ok' : 'status-off'}"></span> ${ok ? 'motor pronto (v' + window.VessieLangRuntime.versao + ')' : 'motor indisponível'}`;
    }

    document.getElementById('run').addEventListener('click', () => {
      const codigo = codeEl.value;
      if (!window.VessieLangRuntime) { print('ERRO: motor VessieLang não carregado.', 'line-erro'); return; }
      const nivel = window.VessieLangRuntime.detectar(codigo);
      print(`> dialeto detectado: ${nivel}`, 'line-nivel');
      try {
        const saida = window.VessieLangRuntime.executar('playground', codigo);
        const isErro = typeof saida === 'string' && saida.startsWith('ERRO');
        print(saida || '(sem saída)', isErro ? 'line-erro' : 'line-ok');
      } catch (e) {
        print('ERRO: ' + e.message, 'line-erro');
      }
    });

    document.getElementById('clear').addEventListener('click', () => { outputEl.innerHTML = ''; });

    // Lista de exemplos oficiais (systems/vessielang/examples/) — carregados
    // por fetch relativo; se abrir este arquivo via file:// direto (sem um
    // servidor local), o fetch pode falhar por CORS — nesse caso a lista
    // simplesmente fica vazia e o playground continua funcionando com o
    // código de exemplo já preenchido no editor.
    const EXEMPLOS = ['exemplo_numeros.vl', 'exemplo_b1.vl', 'exemplo_j3.vl', 'exemplo_g5_os.vl', 'app_lista.vl', 'jogo_demo.vl', 'backup_demo.vl', 'rede_demo.vl'];
    EXEMPLOS.forEach((nome) => {
      const item = document.createElement('div');
      item.className = 'example-item';
      item.textContent = nome;
      item.addEventListener('click', async () => {
        try {
          const resp = await fetch('examples/' + nome);
          if (resp.ok) codeEl.value = await resp.text();
        } catch (e) { print('Não foi possível carregar ' + nome + ' (abra via um servidor local, não file://).', 'line-erro'); }
      });
      examplesEl.appendChild(item);
    });

    refreshStatus();
    setTimeout(refreshStatus, 300);
  </script>
</body>

</html>
