<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console de Comandos</title><link rel="stylesheet" href="../_sdk/vessie-ui.css"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="shell">
    <header class="row"><input id="q" placeholder="Buscar comando (ex.: cor, data, window…)" autocomplete="off"><select id="ns"><option value="">Todos</option></select><span id="count" class="dim"></span></header>
    <main>
      <ul id="list" aria-label="Comandos"></ul>
      <section id="detail" class="col"><p class="dim">Escolha um comando à esquerda.</p></section>
    </main>
  </div>
  <script src="../_sdk/vessie-sdk.js"></script><script src="app.js"></script>
</body></html>
